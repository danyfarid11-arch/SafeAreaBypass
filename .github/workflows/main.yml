name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --recursive https://github.com ~/theos
      - run: THEOS=~/theos make
      - uses: actions/upload-artifact@v4
        with:
          name: SafeAreaBypass-dylib
          path: .theos/obj/debug/SafeAreaBypass.dylib
