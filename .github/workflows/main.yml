name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Compile Dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          printf '#import <UIKit/UIKit.h>\n#import <objc/runtime.h>\nstatic UIEdgeInsets z(id s, SEL u){return (UIEdgeInsets){0,0,0,0};}\n@interface SafeBypass : NSObject\n@end\n@implementation SafeBypass\n+ (void)load { Method m = class_getInstanceMethod([UIView class], @selector(safeAreaInsets)); if (m) { method_setImplementation(m, (IMP)z); } }\n@end\n' > t.m
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" -dynamiclib -fobjc-arc -framework UIKit t.m -o SafeAreaBypass.dylib
          codesign -f -s - SafeAreaBypass.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: SafeAreaBypass-dylib
          path: SafeAreaBypass.dylib
