name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Compile SafeAreaBypass.dylib
        run: |
          cat << 'EOF' > tweak.m
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          static UIEdgeInsets zero_insets(id self, SEL _cmd) {
              return UIEdgeInsetsZero;
          }

          _attribute_((constructor))
          static void init_tweak(void) {
              Method m = class_getInstanceMethod([UIView class], @selector(safeAreaInsets));
              if (m) {
                  method_setImplementation(m, (IMP)zero_insets);
              }
          }
          EOF
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -framework UIKit -framework Foundation -miphoneos-version-min=14.0 tweak.m -o SafeAreaBypass.dylib
          ldid -S SafeAreaBypass.dylib || codesign -f -s - SafeAreaBypass.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: SafeAreaBypass-dylib
          path: SafeAreaBypass.dylib
