name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Compile Dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          printf '#import <UIKit/UIKit.h>\n#import <objc/runtime.h>\nstatic UIEdgeInsets z(id s, SEL u){return UIEdgeInsetsZero;}\n_attribute_((constructor)) static void i(void){Method m=class_getInstanceMethod([UIView class],@selector(safeAreaInsets));if(m){method_setImplementation(m,(IMP)z);}}\n' > t.m
          clang -arch arm64 -isysroot "$SDK" -dynamiclib -fobjc-arc -framework UIKit -miphoneos-version-min=14.0 t.m -o SafeAreaBypass.dylib
          codesign -f -s - SafeAreaBypass.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: SafeAreaBypass-dylib
          path: SafeAreaBypass.dylib
